# ═══════════════════════════════════════════════════════════════════
# VRP Optimizer — Docker Compose
# ═══════════════════════════════════════════════════════════════════
# Chạy:  docker compose up -d
# Dừng:  docker compose down
# Logs:  docker compose logs -f app
# ═══════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vrp_optimizer
      POSTGRES_USER: ${DB_USERNAME:-vrp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vrp_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vrp_admin} -d vrp_optimizer"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrp-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME:-vrp_admin}
      DB_PASSWORD: ${DB_PASSWORD:-vrp_secret_2026}
      SECRET_KEY: ${SECRET_KEY:-myDefaultSuperSecretKeyForJWT256bit!!}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vrp_optimizer
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── React Frontend (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./vrp-frontend
      dockerfile: Dockerfile
    container_name: vrp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata:
