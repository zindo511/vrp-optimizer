# ═══════════════════════════════════════════════════════════════════
# application.yaml — Cấu hình chung (shared across all profiles)
# ═══════════════════════════════════════════════════════════════════
spring:
  application:
    name: vrp
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vrp_optimizer}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  jwtSecret: ${SECRET_KEY}
  jwtExpirationMs: 3600000
  jwtRefreshExpirationMs: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ── OSRM config ──────────────────────────────────────────────────
osrm:
  base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}

# ── Circuit breaker cho OSRM ─────────────────────────────────────
# Nếu OSRM lỗi liên tiếp >= failureThreshold lần → mở circuit
# → dùng Haversine fallback trong resetTimeoutMs giây
# → sau đó thử lại OSRM (half-open)
osrm-circuit-breaker:
  failure-threshold: 3
  reset-timeout-ms: 60000

# ── Actuator — Health Check, Metrics ─────────────────────────────
# Docker/K8s dùng /actuator/health để biết app có sống không.
# Nếu DOWN → auto-restart container.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized   # chỉ show chi tiết khi có JWT
      show-components: when-authorized
  info:
    env:
      enabled: true

# ── App Info (hiện qua /actuator/info) ───────────────────────────
info:
  app:
    name: VRP Optimizer
    version: 1.0.0
    description: Vehicle Routing Problem Optimization Engine

logging:
  level:
    org:
      springframework:
        security: WARN
